# mm remote access: one locked `mm` account whose only use is the relay to
# mmd. mmd renders the keys file from each project's users file.
PermitUserEnvironment no
ExposeAuthInfo yes

Match User mm
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitEmptyPasswords no
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/mm_authorized_keys
    ForceCommand /usr/bin/mm relay serve --stdio --socket /run/mm/mm.sock --daemon-uid 0
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen none
    PermitOpen none
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
    # Probe idle relay sessions so one whose client vanished ends promptly.
    ClientAliveInterval 15
    ClientAliveCountMax 4

Match all
