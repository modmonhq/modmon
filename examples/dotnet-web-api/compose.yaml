services:
  api:
    expose:
      - "8080"
    cpus: "1"
    mem_limit: 384m
    pids_limit: 128

  postgres:
    image: docker.io/library/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "widgets", "-d", "widgets"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: "1"
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres_data:
