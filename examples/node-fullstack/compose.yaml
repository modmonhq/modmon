services:
  frontend:
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: "1"
    mem_limit: 256m
    pids_limit: 128

  backend:
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: "1"
    mem_limit: 384m
    pids_limit: 128

  mongo:
    image: docker.io/library/mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    cpus: "1"
    mem_limit: 768m
    pids_limit: 256

volumes:
  mongo_data:
