      interval: 30s
  worker-4:
    image: nginx:1.27-alpine
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
  worker-5:
    image: nginx:1.27-alpine
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
  worker-6:
    image: nginx:1.27-alpine
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
