name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build without publishing (vX.Y.Z or vX.Y.Z-rc.N); one that does not exist yet builds the chosen branch's head as that tag
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_BRANCH: master
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the tag, version, notes, and branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
      - name: Validate tag, package version, lock, notes with the remote protocol, cleanliness, and ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git checkout -q "refs/tags/$RELEASE_TAG"
          elif [ "$PUBLISH" = true ]; then
            echo "tag $RELEASE_TAG is not in this repository" >&2
            exit 1
          else
            git tag "$RELEASE_TAG" HEAD
            echo "::notice::Dry run: $RELEASE_TAG is not a tag yet, so $(git rev-parse HEAD) is built as $RELEASE_TAG and nothing is published"
          fi
          result=$(node ./scripts/release/validate-tag.mjs "$RELEASE_TAG")
          for field in tag version prerelease commit; do
            echo "$field=$(node -p "JSON.parse(process.argv[1]).$field" "$result")" >> "$GITHUB_OUTPUT"
          done
          echo "epoch=$(node -p 'JSON.parse(process.argv[1]).source_date_epoch' "$result")" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Scan the tagged source
        run: ./scripts/check-public-content.sh
      - name: Check release workflow policy
        run: node ./scripts/release/check-workflow.mjs

  build-linux:
    name: Linux x86_64 and aarch64 in pinned containers
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
      - name: Build, package, and checksum both targets with the release script
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || git tag "$RELEASE_TAG" HEAD
          ./scripts/release/build-linux.sh "$RELEASE_TAG" "target/dist/$RELEASE_TAG"
          ./scripts/release/verify.sh --checksums-only "target/dist/$RELEASE_TAG"
      - name: POSIX installer against a local release
        run: node ./scripts/release/test-install-sh.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            target/dist/${{ needs.validate.outputs.tag }}/mm-${{ needs.validate.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
            target/dist/${{ needs.validate.outputs.tag }}/mm-${{ needs.validate.outputs.tag }}-aarch64-unknown-linux-gnu.tar.gz
            target/dist/${{ needs.validate.outputs.tag }}/mm-${{ needs.validate.outputs.tag }}-source.tar.gz
            target/dist/${{ needs.validate.outputs.tag }}/x86_64-unknown-linux-gnu.metadata.json
            target/dist/${{ needs.validate.outputs.tag }}/aarch64-unknown-linux-gnu.metadata.json
            target/dist/${{ needs.validate.outputs.tag }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS ${{ matrix.target }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/ui/package-lock.json
      - name: Build the embedded dashboard
        run: npm --prefix core/ui ci && npm --prefix core/ui run build
      - name: Build mm and mmd
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target ${{ matrix.target }}
          cargo build --locked --release --features unstable --package mm --bin mm --bin mmd --target ${{ matrix.target }}
      - name: Check that both binaries report the tagged version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for binary in mm mmd; do
            reported=$("target/${{ matrix.target }}/release/$binary" --version)
            test "$reported" = "$binary $VERSION" || { echo "$binary reports '$reported', not '$binary $VERSION'" >&2; exit 1; }
          done
      - name: Package with the release packaging script
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
        run: |
          brew install gnu-tar
          ./scripts/release/package-unix.sh "${{ needs.validate.outputs.tag }}" "${{ matrix.target }}" "target/dist/${{ needs.validate.outputs.tag }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            target/dist/${{ needs.validate.outputs.tag }}/mm-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz
            target/dist/${{ needs.validate.outputs.tag }}/${{ matrix.target }}.metadata.json
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Checksums over every archive, and the release manifest
    needs: [validate, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Write and check SHA256SUMS
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release
          LC_ALL=C sha256sum -- mm-"$RELEASE_TAG"-*.tar.gz > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          cat SHA256SUMS
          cd ..
          ./scripts/release/verify.sh --checksums-only release
      - name: Assemble the release manifest the update check reads
        if: needs.validate.outputs.prerelease == 'false'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_EPOCH: ${{ needs.validate.outputs.epoch }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo metadata --format-version 1 --all-features --locked > cargo-metadata.json
          node ./scripts/release/assemble.mjs --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --epoch "$RELEASE_EPOCH" \
            --packages release --source "release/mm-$RELEASE_TAG-source.tar.gz" --cargo-metadata cargo-metadata.json --output assembled
          cp assembled/manifest.json release/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish the GitHub Release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the files once more
        run: ./scripts/release/verify.sh --checksums-only release
      - name: Require the manifest for a stable release, and none for a candidate
        env:
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then test ! -e release/manifest.json; else test -s release/manifest.json; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/mm-*.tar.gz
            release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.validate.outputs.prerelease == 'false'
        with:
          subject-path: release/manifest.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          assets=(release/mm-"$RELEASE_TAG"-*.tar.gz release/SHA256SUMS)
          if [ -e release/manifest.json ]; then assets+=(release/manifest.json); fi
          gh release create "$RELEASE_TAG" --verify-tag "${kind[@]}" \
            --title "mm ${RELEASE_TAG#v}" --notes-file release/release-notes.md "${assets[@]}"
