name: Managed provider live conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/src/adapters/secrets/vault/**"
      - "core/src/adapters/secrets/openbao/**"
      - "core/src/adapters/managed_service_runtime.rs"
      - "core/src/adapters/runtime/**"
      - "core/tests/vault.rs"
      - "core/tests/openbao.rs"
      - "scripts/live-vault-provider.sh"
      - ".github/workflows/vault-live.yml"
  push:
    branches: [main, master]
    paths:
      - "core/src/adapters/secrets/vault/**"
      - "core/src/adapters/secrets/openbao/**"
      - "core/src/adapters/managed_service_runtime.rs"
      - "core/src/adapters/runtime/**"
      - "core/tests/vault.rs"
      - "core/tests/openbao.rs"
      - "scripts/live-vault-provider.sh"
      - ".github/workflows/vault-live.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/live-vault-provider.sh external 2>&1 | tee vault-external-live.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vault-external-live
          path: vault-external-live.log
          retention-days: 30

  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker-compose, podman-compose]
        provider: [vault, openbao]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.runtime == 'podman-compose'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose
          podman info
      - run: ./scripts/live-vault-provider.sh managed "${{ matrix.runtime }}" "${{ matrix.provider }}" 2>&1 | tee managed-live.log
      - if: failure() && matrix.runtime == 'podman-compose'
        run: |
          sudo dmesg | grep -i -E 'apparmor|denied' | tail -40 || true
          ls /etc/apparmor.d | grep -i -E 'pasta|passt|podman|slirp' || true
          for f in /etc/apparmor.d/usr.bin.pasta /etc/apparmor.d/usr.bin.passt /etc/apparmor.d/abstractions/pasta /etc/apparmor.d/abstractions/passt /etc/apparmor.d/podman; do echo "--- $f"; cat "$f" 2>/dev/null; done
          ps -eZ | grep -i -E 'pasta|podman|catatonit' || true
          podman info --format '{{.Host.NetworkBackend}} {{.Host.RootlessNetworkCmd}}' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: managed-live-${{ matrix.provider }}-${{ matrix.runtime }}
          path: managed-live.log
          retention-days: 30
