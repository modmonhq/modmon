name: Rust

on:
  pull_request:
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "Dockerfile.cargo"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/getting-started.md"
      - "examples/README.md"
      - "examples/laravel-rust/services/pricing/Cargo.toml"
      - "examples/laravel-rust/services/pricing/Dockerfile"
      - "scripts/check-rust-pins.sh"
      - ".github/workflows/**"
  push:
    branches:
      - master
      - main
    paths:
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "Dockerfile.cargo"
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/getting-started.md"
      - "examples/README.md"
      - "examples/laravel-rust/services/pricing/Cargo.toml"
      - "examples/laravel-rust/services/pricing/Dockerfile"
      - "scripts/check-rust-pins.sh"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/ui/package-lock.json
      - name: Build embedded dashboard
        run: npm --prefix core/ui ci && npm --prefix core/ui run build
      - name: Assert Rust pins agree
        run: bash ./scripts/check-rust-pins.sh
      - name: Report pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      - run: cargo metadata --format-version 1 --all-features --locked > dependency-inventory.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dependency-inventory
          path: dependency-inventory.json
          if-no-files-found: error
          retention-days: 14

  deny:
    name: Dependency policy (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: workspace
            manifest: ./Cargo.toml
          - name: pricing example
            manifest: ./examples/laravel-rust/services/pricing/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"
          manifest-path: ${{ matrix.manifest }}
          command: check

  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        # Linux tests run in Workspace quality. Native Windows is not supported:
        # mm relies on Unix permissions, ownership, and sockets.
        os:
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/ui/package-lock.json
      - name: Build embedded dashboard
        run: npm --prefix core/ui ci && npm --prefix core/ui run build
      - name: Report pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      - run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
