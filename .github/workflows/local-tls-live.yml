name: Local TLS live trust

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/src/adapters/ca/**"
      - "core/src/app/ca.rs"
      - "core/src/app/ports/ca.rs"
      - "core/src/app/traefik_dynamic.rs"
      - "core/src/app/deployment*"
      - "core/src/domain/ca.rs"
      - "core/src/presentation/**"
      - "scripts/live-local-tls.sh"
      - ".github/workflows/local-tls-live.yml"
  push:
    branches: [main, master]
    paths:
      - "core/src/adapters/ca/**"
      - "core/src/app/ca.rs"
      - "core/src/app/ports/ca.rs"
      - "core/src/app/traefik_dynamic.rs"
      - "core/src/app/deployment*"
      - "core/src/domain/ca.rs"
      - "core/src/presentation/**"
      - "scripts/live-local-tls.sh"
      - ".github/workflows/local-tls-live.yml"

permissions:
  contents: read

jobs:
  trust-and-handshake:
    name: trust-and-handshake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/ui/package-lock.json
      - name: Build embedded dashboard
        run: npm --prefix core/ui ci && npm --prefix core/ui run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      - name: Preauthorize Linux system trust
        if: runner.os == 'Linux'
        run: sudo -v
      - name: Build mm
        run: cargo build --features unstable --locked
      - name: Exercise actual store and system curl
        shell: bash
        env:
          MM_BIN: target/debug/mm
          MM_NO_SYSTEM_TRUST: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: ./scripts/live-local-tls.sh 2>&1 | tee local-tls-live.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: local-tls-live-${{ runner.os }}
          path: local-tls-live.log
          if-no-files-found: error
          retention-days: 30
