name: Scheduler live

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/src/**scheduler*"
      - "core/src/adapters/runtime/operations.rs"
      - "core/src/adapters/state/sqlite/scheduler.rs"
      - "core/migrations/0005_durable_jobs.sql"
      - "core/tests/scheduler.rs"
      - "scripts/live-scheduler.sh"
      - ".github/workflows/scheduler-live.yml"
  push:
    branches: [main, master]
    paths:
      - "core/src/**scheduler*"
      - "core/src/adapters/runtime/operations.rs"
      - "core/src/adapters/state/sqlite/scheduler.rs"
      - "core/migrations/0005_durable_jobs.sql"
      - "core/tests/scheduler.rs"
      - "scripts/live-scheduler.sh"
      - ".github/workflows/scheduler-live.yml"

permissions:
  contents: read

jobs:
  live:
    name: live-jobs-${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker-compose, podman-compose]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/ui/package-lock.json
      - name: Build embedded dashboard
        run: npm --prefix core/ui ci && npm --prefix core/ui run build
      - name: Install rootless Podman Compose
        if: matrix.runtime == 'podman-compose'
        run: sudo apt-get update && sudo apt-get install --yes podman podman-compose
      - name: Build mm in the constrained Cargo container
        run: |
          mkdir -p .live-cargo .live-target
          docker build --memory=4g --cpu-quota=200000 --cpu-period=100000 -t mm-cargo-live -f Dockerfile.cargo .
          docker run --rm --cpus=2 --memory=4g --pids-limit=512 \
            --user "$(id -u):$(id -g)" -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/target -e CARGO_BUILD_JOBS=2 \
            -v "$PWD:/workspace" -v "$PWD/.live-cargo:/cargo" -v "$PWD/.live-target:/target" \
            -w /workspace mm-cargo-live cargo build --bin mm --all-features --locked
      - name: Run manual, failure, scheduled, restart-safe, and cleanup evidence
        env:
          MM_BIN: ${{ github.workspace }}/.live-target/debug/mm
        shell: bash
        run: ./scripts/live-scheduler.sh "${{ matrix.runtime }}" 2>&1 | tee scheduler-live.log
      - name: Clean build and runtime resources
        if: always()
        run: |
          rm -rf .live-cargo .live-target
          docker image rm mm-cargo-live >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduler-live-${{ matrix.runtime }}
          path: scheduler-live.log
          if-no-files-found: error
          retention-days: 30
