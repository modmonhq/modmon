name: Deploy site

# Builds the website (lander, docs, and /install.sh) and deploys it to the Cloudflare
# Worker in site/wrangler.jsonc: on a push to master that changes it, by hand, and once
# the release workflow has published a vX.Y.Z release (not a candidate). Needs two
# secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Workers Routes: Edit on
# the zone) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - "docs/**"
      - "packages/ui/**"
      - "packaging/release/install.sh"
      - "scripts/check-built-links.mjs"
      - "scripts/check-public-content.sh"
      - ".github/workflows/site-deploy.yml"
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than interrupting an upload.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://modmon.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      # Generates the static site, then checks its links, HTML, and public content.
      - run: npm --prefix site run build
      - name: Deploy to Cloudflare
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.161.0 deploy
