name: Secret delivery live conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/src/adapters/secrets/**"
      - "core/src/adapters/process/**"
      - "core/src/app/environment.rs"
      - "core/src/domain/runtime_secret.rs"
      - "core/src/app/deployment*"
      - "core/src/app/ports/process.rs"
      - "core/src/app/ports/secrets.rs"
      - "core/src/composition.rs"
      - "core/src/domain/config.rs"
      - "core/src/domain/runtime.rs"
      - "core/src/domain/secret_contract.rs"
      - "core/tests/runtime_secret_delivery.rs"
      - "scripts/live-secret-delivery.sh"
      - ".github/workflows/secret-live.yml"
  push:
    branches: [main, master]
    paths:
      - "core/src/adapters/secrets/**"
      - "core/src/adapters/process/**"
      - "core/src/app/environment.rs"
      - "core/src/domain/runtime_secret.rs"
      - "core/src/app/deployment*"
      - "core/src/app/ports/process.rs"
      - "core/src/app/ports/secrets.rs"
      - "core/src/composition.rs"
      - "core/src/domain/config.rs"
      - "core/src/domain/runtime.rs"
      - "core/src/domain/secret_contract.rs"
      - "core/tests/runtime_secret_delivery.rs"
      - "scripts/live-secret-delivery.sh"
      - ".github/workflows/secret-live.yml"

permissions:
  contents: read

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/live-secret-delivery.sh docker-compose 2>&1 | tee secret-docker-compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secret-live-docker-compose
          path: secret-docker-compose.log
          retention-days: 30

  podman:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install --yes podman
      - run: test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - run: ./scripts/live-secret-delivery.sh podman 2>&1 | tee secret-podman.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secret-live-podman
          path: secret-podman.log
          retention-days: 30
