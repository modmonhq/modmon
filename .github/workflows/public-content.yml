name: Public content

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  public-content:
    name: Public release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Scan raw source tree
        run: ./scripts/check-public-content.sh
      - name: Test public content scanner
        run: ./scripts/test-check-public-content.sh
      - name: Build, inventory, extract, and reproduce release source
        run: ./scripts/test-release-source.sh
