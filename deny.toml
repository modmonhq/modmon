[graph]
all-features = true

[advisories]
yanked = "deny"
# Advisories with no fixed release reachable from our direct dependencies.
# Owner: maintainers; review by 2026-12-09.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; reached only through serde_yaml_ng, which has no release without it" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; reached only through age's i18n-embed, and age has no newer release" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 has no fixed release; it backs age's p256 recipients, and mm uses only X25519 identities" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no replacement release; moving mm and mm-domain to jiff or time is its own change" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with no replacement release; it goes with chrono" },
]

[licenses]
# This policy is shared with the smaller standalone example, where some approved
# workspace licenses are absent. Owner: maintainers; review by 2026-11-22.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Transitive major-version transitions remain visible without blocking unrelated
# changes; grouped weekly updates revisit them. Owner: maintainers; review by 2026-11-22.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
