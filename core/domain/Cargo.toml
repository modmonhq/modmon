[package]
name = "mm-domain"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/modmonhq/modmon"
homepage = "https://modmon.dev"
publish = false

[lib]
path = "lib.rs"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
regex = "1.13.1"
schemars = { version = "1.2.2", features = ["uuid1"] }
semver = "1.0.28"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
thiserror = "2.0.16"
time = { version = "0.3.55", features = ["parsing"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = { version = "1.8.1", features = ["derive", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.21.0"
proptest = "1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
