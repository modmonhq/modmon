[package]
name = "mm"
version = "0.1.3"
description = "Turn a list of servers into one cluster that runs your Docker Compose project"
edition = "2024"
rust-version = "1.99"
license = "MIT"
readme = "README.md"
repository = "https://github.com/modmonhq/modmon"
homepage = "https://modmon.dev"
keywords = ["cluster", "compose", "deploy", "docker", "podman"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[features]
unstable = []

[[bin]]
name = "mm"
path = "src/main.rs"
required-features = ["unstable"]

[[bin]]
name = "mmd"
path = "src/bin/mmd.rs"
required-features = ["unstable"]

[[bin]]
name = "mm-ingress-helper"
path = "src/bin/mm-ingress-helper.rs"
required-features = ["unstable"]

[dependencies]
mm-domain = { path = "domain" }
age = { version = "0.12.1", default-features = false, features = ["armor"] }
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
atomic-write-file = "0.3.1"
axum = { version = "0.8.4", features = ["form", "http1", "json", "tokio"] }
base64 = "0.23.1"
blake3 = "1.8.2"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
clap_complete = "4.5.58"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
dunce = "1.0.5"
fs4 = "1.1.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
futures-util = "0.3.31"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
ignore = "0.4.23"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "x509-parser"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
rust-embed = { version = "8.7.2", features = ["deterministic-timestamps"] }
rpassword = "7.4.0"
schemars = { version = "1.2.2", features = ["uuid1"] }
semver = "1.0.28"
serde = { version = "1.0.219", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.143"
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.21.0"
tar = "0.4.44"
thiserror = "2.0.16"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
yaml-edit = { version = "0.3.2", default-features = false }
zeroize = { version = "1.8.1", features = ["derive", "serde"] }
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
# Takes the sockets systemd kept for mmd across a restart (LISTEN_FDS).
listenfd = "1.0.2"
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
proptest = "1.11.0"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "server", "transport-async-rw"] }
# A paused clock for tests of what waits for a node.
tokio = { version = "1.47.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
