services:
  api:
    image: docker.io/library/busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    command: ["sh", "-c", "printf 'mm-observe-stdout\\n'; printf 'mm-observe-stderr\\n' >&2; printf '%s' \"$$MM_CONFORMANCE_REVISION\" > /tmp/revision; sleep 3600"]
    environment:
      MM_CONFORMANCE_REVISION: ${MM_CONFORMANCE_REVISION:?set by the private operation environment}
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/revision"]
      interval: 1s
      timeout: 1s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    labels:
      io.mm.generation: "1"
      io.mm.resource: app
      io.mm.resource-kind: stack
      io.mm.target-id: 319c527b-6242-7b43-bfd4-bd60e27c1de3
      io.mm.project-id: 019c527b-6242-7b43-bfd4-bd60e27c1de3
      io.mm.environment: conformance
      io.mm.stack: app
      io.mm.image-origin: first-party
    networks:
      conformance:
        aliases: [api.internal]
    volumes:
      - conformance-data:/data
networks:
  conformance:
    external: true
    name: mm-runtime-conformance-network
volumes:
  conformance-data:
    external: true
    name: mm-runtime-conformance-volume
