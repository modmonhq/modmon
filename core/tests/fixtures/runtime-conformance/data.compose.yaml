services:
  worker:
    image: docker.io/library/busybox@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
    command: ["sh", "-c", "sleep 3600"]
    healthcheck:
      test: ["CMD-SHELL", "test -d /tmp"]
      interval: 1s
      timeout: 1s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    labels:
      io.mm.generation: "1"
      io.mm.resource: data
      io.mm.resource-kind: stack
      io.mm.target-id: 319c527b-6242-7b43-bfd4-bd60e27c1de3
      io.mm.project-id: 019c527b-6242-7b43-bfd4-bd60e27c1de3
      io.mm.environment: conformance
      io.mm.stack: data
      io.mm.image-origin: third-party
    networks:
      conformance:
        aliases: [worker.internal]
networks:
  conformance:
    external: true
    name: mm-runtime-conformance-network
